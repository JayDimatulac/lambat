services:
  # ---------- Backend API ----------
  - type: web
    name: lambat-api
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production

      # You paste these yourself (Supabase pooler strings, site address, Gemini key)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false

      # Render creates these random values for you
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: SMS_WEBHOOK_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: SMS_DRY_RUN
        value: "true"

  # ---------- Frontend (static site) ----------
  - type: web
    name: lambat-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API address ending in /api, for example https://lambat-api.onrender.com/api
      - key: VITE_API_URL
        sync: false